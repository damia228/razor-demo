<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080a"><title>RAZOR Control</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/admin.css"></head><body><div class="admin-bg"></div><header class="admin-nav shell"><div><a class="brand" href="/admin">RAZOR<span>.</span></a><span class="admin-badge">CONTROL</span></div><div class="admin-actions"><a href="/admin/export.csv" class="outline-button">Экспорт CSV</a><a href="/" class="outline-button">Открыть сайт</a><form method="post" action="/admin/logout"><button class="logout-button">Выйти</button></form></div></header><main class="shell admin-main"><section class="dashboard-head"><div><span class="eyebrow">ПАНЕЛЬ УПРАВЛЕНИЯ</span><h1>Сегодня в RAZOR.</h1><p id="updatedAt">Загружаем данные…</p></div><button id="refreshButton" class="gold-button">Обновить</button></section><section class="stats-grid"><article><span>Записей сегодня</span><strong id="statToday">—</strong><small>кроме отменённых</small></article><article><span>Новых заявок</span><strong id="statNew">—</strong><small>ждут подтверждения</small></article><article><span>Выручка за месяц</span><strong id="statRevenue">—</strong><small>по завершённым</small></article><article><span>Топ-мастер</span><strong id="statMaster">—</strong><small>по числу записей</small></article></section><section class="toolbar"><div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="Имя, телефон, услуга, код…"></div><select id="masterFilter"><option value="">Все мастера</option><option>Арман</option><option>Тимур</option><option>Данияр</option></select><input id="dateFilter" type="date"><select id="statusFilter"><option value="">Все статусы</option><option value="new">Новые</option><option value="confirmed">Подтверждённые</option><option value="completed">Завершённые</option><option value="cancelled">Отменённые</option></select><button id="resetFilters" class="text-button">Сбросить</button></section><section class="bookings-card"><div class="card-head"><div><span class="eyebrow">РАСПИСАНИЕ</span><h2>Записи</h2></div><span id="visibleCount" class="count-pill">0</span></div><div id="bookingList" class="booking-list"></div><div id="emptyState" class="empty-state" hidden>Ничего не найдено по выбранным фильтрам.</div></section></main><div id="drawerBackdrop" class="drawer-backdrop" hidden></div><aside id="drawer" class="drawer" aria-hidden="true"><button id="closeDrawer" class="drawer-close">×</button><div id="drawerContent"></div></aside><script>
const $=s=>document.querySelector(s), list=$('#bookingList'), empty=$('#emptyState');let bookings=[];
const labels={new:'Новая',confirmed:'Подтверждена',completed:'Завершена',cancelled:'Отменена'};
const fmtDate=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${d}.${m}.${y}`}; const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₸';
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opts){const r=await fetch(url,opts),d=await r.json();if(r.status===401){location='/admin/login';throw new Error('auth')}if(!r.ok)throw new Error(d.error||'Ошибка');return d}
async function load(){try{const [b,s]=await Promise.all([api('/api/bookings'),api('/api/admin/stats')]);bookings=b.bookings;render();renderStats(s.stats);$('#updatedAt').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch(e){if(e.message!=='auth')$('#updatedAt').textContent=e.message}}
function renderStats(s){$('#statToday').textContent=s.today;$('#statNew').textContent=s.new;$('#statRevenue').textContent=money(s.revenue_month);$('#statMaster').textContent=s.top_master;}
function filtered(){const q=$('#searchInput').value.trim().toLowerCase(),m=$('#masterFilter').value,d=$('#dateFilter').value,st=$('#statusFilter').value;return bookings.filter(b=>{const h=[b.name,b.phone,b.service,b.master,b.reference_code].join(' ').toLowerCase();return(!q||h.includes(q))&&(!m||b.master===m)&&(!d||b.booking_date===d)&&(!st||b.status===st)})}
function actions(b){if(b.status==='new')return`<button data-status="confirmed" class="mini gold">Подтвердить</button><button data-status="cancelled" class="mini danger">Отменить</button>`;if(b.status==='confirmed')return`<button data-status="completed" class="mini success">Завершить</button><button data-status="cancelled" class="mini danger">Отменить</button>`;if(b.status==='cancelled')return`<button data-status="confirmed" class="mini blue">Восстановить</button>`;return'<span class="done">Готово</span>'}
function render(){const arr=filtered();list.innerHTML='';empty.hidden=!!arr.length;$('#visibleCount').textContent=arr.length;arr.forEach(b=>{const el=document.createElement('article');el.className='booking-row';el.innerHTML=`<button class="row-main" type="button"><div class="date-block"><strong>${esc(fmtDate(b.booking_date))}</strong><span>${esc(b.booking_time)}</span></div><div class="client-block"><strong>${esc(b.name)}</strong><span>${esc(b.phone)}</span></div><div class="service-block"><strong>${esc(b.service)}</strong><span>${esc(b.master)} • ${money(b.price)}</span></div><div><span class="status-pill status-${esc(b.status)}">${esc(labels[b.status]||b.status)}</span></div><div class="ref">${esc(b.reference_code)}</div></button><div class="row-actions">${actions(b)}</div>`;el.querySelector('.row-main').onclick=()=>openDrawer(b);el.querySelectorAll('[data-status]').forEach(btn=>btn.onclick=()=>changeStatus(b,btn.dataset.status));list.appendChild(el)})}
async function changeStatus(b,status){if(!confirm(`Изменить статус записи ${b.reference_code} на «${labels[status]}»?`))return;try{await api(`/api/bookings/${b.id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await load();}catch(e){alert(e.message)}}
async function openDrawer(b){$('#drawerBackdrop').hidden=false;$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');let history=[];try{history=(await api(`/api/bookings/${b.id}/history`)).events}catch(e){}$('#drawerContent').innerHTML=`<span class="eyebrow">${esc(b.reference_code)}</span><div class="drawer-title"><h2>${esc(b.name)}</h2><span class="status-pill status-${esc(b.status)}">${esc(labels[b.status])}</span></div><div class="detail-grid"><div><span>Телефон</span><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></div><div><span>Мастер</span><strong>${esc(b.master)}</strong></div><div><span>Услуга</span><strong>${esc(b.service)}</strong></div><div><span>Стоимость</span><strong>${money(b.price)}</strong></div><div><span>Дата</span><strong>${esc(fmtDate(b.booking_date))}</strong></div><div><span>Время</span><strong>${esc(b.booking_time)}</strong></div></div><div class="note-block"><span>Комментарий клиента</span><p>${esc(b.client_note||'Нет комментария')}</p></div><div class="note-editor"><label>Заметка администратора</label><textarea id="adminNote" rows="4" maxlength="1000">${esc(b.admin_note||'')}</textarea><button id="saveNote" class="gold-button">Сохранить заметку</button></div><div class="history"><span class="eyebrow">ИСТОРИЯ</span>${history.length?history.map(h=>`<div><strong>${esc(h.event_type==='status'?(labels[h.new_value]||h.new_value):h.event_type)}</strong><span>${esc(h.created_at)}</span></div>`).join(''):'<p>История пока пустая.</p>'}</div>`;$('#saveNote').onclick=async()=>{try{await api(`/api/bookings/${b.id}/note`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:$('#adminNote').value})});await load();$('#saveNote').textContent='Сохранено';}catch(e){alert(e.message)}}}
function closeDrawer(){$('#drawerBackdrop').hidden=true;$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}
$('#closeDrawer').onclick=closeDrawer;$('#drawerBackdrop').onclick=closeDrawer;$('#refreshButton').onclick=load;['searchInput','masterFilter','dateFilter','statusFilter'].forEach(id=>$('#'+id).addEventListener(id==='searchInput'?'input':'change',render));$('#resetFilters').onclick=()=>{$('#searchInput').value='';$('#masterFilter').value='';$('#dateFilter').value='';$('#statusFilter').value='';render()};load();
</script></body></html>
