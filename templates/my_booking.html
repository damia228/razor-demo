<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080a"><title>{{ brand.name }} — Моя запись</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body class="account-page"><div class="noise"></div><nav class="nav shell simple-nav"><a class="brand" href="/">{{ brand.name }}<span>.</span></a><a class="ghost-link" href="/">← На сайт</a></nav><main class="lookup-shell shell"><section class="lookup-copy"><span class="eyebrow">МОЯ ЗАПИСЬ</span><h1>Всё под<br><em>контролем.</em></h1><p>Введи код, который получил после бронирования, и номер телефона.</p></section><section class="lookup-card"><form id="lookupForm"><div class="field full"><label for="reference">Код записи</label><input id="reference" name="reference" placeholder="{{ commerce.reference_prefix }}-ABC123" autocomplete="off" required></div><div class="field full"><label for="phone">Телефон</label><input id="phone" name="phone" type="tel" placeholder="{{ commerce.phone_placeholder }}" required></div><button class="submit-button full" type="submit"><span>Найти запись</span><b>→</b></button><p id="lookupStatus" class="form-status full"></p></form><div id="bookingResult" class="booking-result" hidden></div></section></main><script>
const form=document.getElementById('lookupForm'), statusEl=document.getElementById('lookupStatus'), resultEl=document.getElementById('bookingResult'); let credentials=null;
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
form.addEventListener('submit',async e=>{e.preventDefault();statusEl.textContent='Ищем запись…';resultEl.hidden=true;credentials=Object.fromEntries(new FormData(form).entries());try{const r=await fetch('/api/my-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentials)}),d=await r.json();if(!r.ok)throw new Error(d.error);const b=d.booking;resultEl.innerHTML=`<div class="result-head"><div><span class="eyebrow">${esc(b.reference_code)}</span><h2>${esc(b.service)}</h2></div><span class="client-status status-${esc(b.status)}">${esc(b.status_label)}</span></div><div class="result-grid"><div><span>{{ terms.staff_singular|default("Специалист")|capitalize }}</span><strong>${esc(b.master)}</strong></div><div><span>Дата</span><strong>${esc(b.booking_date)}</strong></div><div><span>Время</span><strong>${esc(b.booking_time)}</strong></div><div><span>Стоимость</span><strong>${Number(b.price).toLocaleString('ru-RU')} {{ currency }}</strong></div></div>${b.client_note?`<div class="result-note"><span>Комментарий</span><p>${esc(b.client_note)}</p></div>`:''}${b.can_cancel?'<button id="cancelBooking" class="danger-button" type="button">Отменить запись</button>':'<p class="locked-note">Для этой записи самостоятельная отмена недоступна.</p>'}`;resultEl.hidden=false;statusEl.textContent='';const btn=document.getElementById('cancelBooking');if(btn)btn.onclick=cancelBooking;}catch(err){statusEl.textContent=err.message;statusEl.className='form-status full error';}});
async function cancelBooking(){if(!confirm('Точно отменить запись? Освободившееся время сможет занять другой клиент.'))return;const r=await fetch('/api/my-booking/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentials)}),d=await r.json();if(!r.ok){alert(d.error);return;}form.requestSubmit();}
</script></body></html>
