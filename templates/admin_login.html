<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080a"><title>{{ brand.name }} Control — вход</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/admin.css"><style>:root{--gold:{{ brand.accent|default('#d9b65e') }};--gold2:{{ brand.accent_soft|default('#f1d894') }};}</style></head><body class="login-page"><main class="login-wrap"><section class="login-visual" style="background-image:linear-gradient(90deg,rgba(8,8,10,.35),rgba(8,8,10,.85)),url('{{ business.visuals.admin_image }}')"><a class="brand" href="/">{{ brand.name }}<span>.</span></a><div><span class="eyebrow">CONTROL CENTER</span><h1>Бизнес<br>под контролем.</h1><p>Записи, статусы, выручка и клиентская история в одном месте.</p></div><small>{{ brand.name }} / ADMIN</small></section><section class="login-panel"><form method="post"><span class="eyebrow">ЗАЩИЩЁННЫЙ ВХОД</span><h2>Добро пожаловать.</h2><p>Введи пароль администратора.</p><label>Пароль<input type="password" name="password" autocomplete="current-password" required autofocus></label><button class="gold-button" type="submit">Войти</button>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<a href="/" class="login-back">← Вернуться на сайт</a></form></section></main></body></html>
