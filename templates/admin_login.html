<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAZOR CRM — вход</title><link rel="stylesheet" href="/static/admin.css"></head>
<body class="login-body"><main class="login-card"><div class="admin-brand">RAZOR<span>.</span> CRM</div>
{% if setup_required %}<h1>Нужен пароль администратора</h1><p>На сервере добавьте переменную окружения <code>ADMIN_PASSWORD</code>, затем перезапустите сервис.</p>{% else %}<h1>Вход в CRM</h1><p>Введите пароль администратора.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><label>Пароль<input type="password" name="password" autofocus required></label><button type="submit">Войти</button></form>{% endif %}
<a class="back-link" href="/">← На сайт</a></main></body></html>
